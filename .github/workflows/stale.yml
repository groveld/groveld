---
name: Close stale issues and PRs

on:
  workflow_dispatch:
  schedule:
    - cron: 30 1 * * * # Runs daily at 01:30 UTC

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629
        with:
          stale-issue-message: >
            Message to comment on stale issues.
            If none provided, will not mark issues stale
          stale-pr-message: >
            Message to comment on stale PRs.
            If none provided, will not mark PRs stale'
